name: FAM Scout Sync

on:
  schedule:
    - cron: '0 13 * * *' # Every day at 13:00 UTC (8:00 AM EST)
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger from GitHub web UI

permissions:
  contents: write # Allows the runner to commit and push database/HTML updates back to main

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Cache Playwright Browser Binaries
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright & System Dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run FAM Scout
        env:
          CREDENTIALS_KEY: ${{ secrets.CREDENTIALS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          ENABLE_DESKTOP: false
          ENABLE_EMAIL: false
          ENABLE_PUSHOVER: false
        run: node scout.js

      - name: Commit and Push Compiled Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/seen_deals.json data/run_history.json data/seen_sailing_keys.json data/active_sailings_previous.json flyers/ auth/*-state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Sync: Update FAM deals database & dashboard" && git push origin main)

      - name: Prepare Public Directory for Firebase
        run: |
          mkdir -p public
          cp index.html public/
          cp logo.png public/
          cp -r flyers public/ || true

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_ADMIN_SECRET: "${{ secrets['firebase-admin'] }}"
        run: |
          echo "Secret info: length=${#FIREBASE_ADMIN_SECRET}" > deploy-error.log
          if [ -n "$FIREBASE_ADMIN_SECRET" ]; then
            echo "First 10 chars: $(echo -n "$FIREBASE_ADMIN_SECRET" | head -c 10)" >> deploy-error.log
            echo "Last 10 chars: $(echo -n "$FIREBASE_ADMIN_SECRET" | tail -c 10)" >> deploy-error.log
          fi
          node -e '
            const fs = require("fs");
            const secret = process.env.FIREBASE_ADMIN_SECRET || "";
            if (secret.trim().startsWith("{")) {
              console.log("Writing service-account.json...");
              fs.writeFileSync("service-account.json", secret);
            }
          '
          if [ -f service-account.json ]; then
            echo "Authenticating via Service Account JSON..." >> deploy-error.log
            export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
            echo "Listing projects..." >> deploy-error.log
            npx firebase-tools projects:list >> deploy-error.log 2>&1 || true
            npx firebase-tools deploy --only hosting --project fambotpage >> deploy-error.log 2>&1
          else
            echo "Authenticating via Firebase Auth Token..." >> deploy-error.log
            echo "Listing projects..." >> deploy-error.log
            npx firebase-tools projects:list --token "$FIREBASE_ADMIN_SECRET" >> deploy-error.log 2>&1 || true
            npx firebase-tools deploy --only hosting --project fambotpage --token "$FIREBASE_ADMIN_SECRET" >> deploy-error.log 2>&1
          fi

      - name: Push Error Logs if Failed
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-error.log
          git commit -m "Auto-capture deploy error logs [skip ci]" || true
          git push origin main || true
